<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BS Art</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="left_s settingspan">
            <div class="logo">BSArt</div>
            <div class="setting">
                <div>Размер арта <span id="pixelSlider_val"></span></div>
                <select id="pixelSlider">
                    <option value="2">2 × 2</option>
                    <option value="4">4 × 4</option>
                    <option value="8">8 × 8</option>
                    <option value="16">16 × 16</option>
                    <option value="32" selected>32 × 32</option>
                    <option value="64">64 × 64</option>
                    <option value="128">128 × 128</option>
                    <option value="256">256 × 256</option>
                </select>
            </div>
            <div class="setting">
                <div>Цвет сетки</div>
                <select id="colorselect"></select>
            </div>
            <div class="setting">
                <label class="check"><input type="checkbox" id="ditherChk"> Дизеринг (плавные переходы)</label>
            </div>
            <div class="setting">
                <div>Загрузить фото</div>
                <input type="file" class="filter-control" id="memberfile" accept="image/*">
            </div>
            <div class="setting">
                <div></div>
                <input type="button" class="filter-control" id="acceptbutton" value="Обработать">
            </div>
            <div class="setting">
                <div>Экспорт для бота</div>
                <div class="trio">
                    <label>X<input type="number" id="expX" value="0"></label>
                    <label>Y<input type="text" id="expY" value="?"></label>
                    <label>Z<input type="number" id="expZ" value="0"></label>
                </div>
                <label class="check"><input type="checkbox" id="expFlip" checked> Z растёт снизу вверх (0 — левый нижний угол)</label>
                <label class="check"><input type="checkbox" id="expSkip" checked> Пропускать пустые клетки</label>
                <div id="expInfo"></div>
                <input type="button" class="filter-control" id="downloadTxt" value="Скачать .txt">
            </div>
            <div class="setting">
                <div>Скачать результат</div>
                <input type="button" class="filter-control" id="downloadButton" value="Скачать PNG">
            </div>
        </div>
        <div class="right_s settingspan">
            <div class="setting">
                <div>Загруженное фото</div>
                <img src="./bsart.png" id="myimg" alt="Загруженное фото">
            </div>
            <div class="setting">
                <div>Обработка шаг @1</div>
                <canvas class="temp_canvas" id="temp_canvas"></canvas>
            </div>
            <div class="setting">
                <div>Вид на миникарте</div>
                <canvas class="final_canvas" id="final_canvas2"></canvas>
            </div>
        </div>
        <div class="content">
            <canvas class="control_canvas" id="control_canvas"></canvas>
            <div id="hud">—</div>
            <input type="button" id="fitbutton" value="Вписать">
        </div>
    </div>

    <div id="cropModal" hidden>
        <div class="cropbox"><img id="cropImg" alt=""></div>
        <div class="cropbtns">
            <input type="button" id="cropOk" value="Обрезать">
            <input type="button" id="cropNo" value="Отмена">
        </div>
    </div>
    <div id="toast"></div>

    <script src="js/blocks.js"></script>
    <script src="js/textures.js"></script>
    <script src="js/processor.js"></script>
    <script src="js/viewer.js"></script>
    <script src="js/exporter.js"></script>
    <script src="js/cropper.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
